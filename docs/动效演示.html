<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>映词 1.4.2 · 面板动效演示</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        background: #101619;
        color: #eee9df;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 36px 5vw 48px;
      }
      main {
        max-width: 1280px;
        margin: auto;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 25px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.2em;
        color: #b2c5c8;
      }
      h1 {
        font-weight: 500;
        font-size: 29px;
        letter-spacing: 0.09em;
        margin: 8px 0;
      }
      header p,
      .intro {
        font-size: 12px;
        line-height: 1.9;
        color: #8fa0a6;
        margin: 0;
      }
      header p {
        max-width: 440px;
      }
      #stage {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #15222b;
        border: 1px solid #35414a;
      }
      .player {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 0;
      }
      .player input {
        flex: 1;
      }
      .player output {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        min-width: 82px;
        color: #a7b9be;
      }
      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
        background: #182126;
        border: 1px solid #3a484e;
        border-radius: 3px;
      }
      button {
        padding: 9px 16px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        border-color: #c7d0c7;
      }
      .mode.active {
        background: #d1d4c3;
        color: #142128;
        border-color: #d1d4c3;
      }
      .controls {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr;
        gap: 18px;
        padding-top: 20px;
        border-top: 1px solid #344149;
      }
      label {
        font-size: 12px;
        line-height: 1.8;
        color: #acbec2;
      }
      select,
      textarea {
        display: block;
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        outline: none;
      }
      textarea {
        height: 78px;
        resize: vertical;
      }
      .lyrics {
        grid-column: 1/3;
      }
      .size {
        align-self: end;
      }
      .size input {
        display: block;
        width: 100%;
        margin: 14px 0;
      }
      input[type='range'] {
        accent-color: #ced0bc;
      }
      .intro {
        margin-top: 18px;
      }
      .shots {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 18px;
      }
      .shots button {
        color: #aabac0;
        padding: 8px 12px;
        background: transparent;
      }
      .shots .active {
        color: #edf1e6;
        border-color: #c1cdbf;
      }
      .notes {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 28px;
        color: #748991;
        font-size: 11px;
        line-height: 1.8;
      }
      a {
        color: #c9d0bd;
        text-underline-offset: 4px;
      }
      @media (max-width: 820px) {
        body {
          padding: 20px;
        }
        header {
          display: block;
        }
        header p {
          margin-top: 12px;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .lyrics {
          grid-column: auto;
        }
        .player {
          flex-wrap: wrap;
        }
        .notes {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">LYRICMOTION / MOTION STUDY</div>
          <h1>面板动效演示</h1>
        </div>
        <p>
          使用映词 1.4.2
          的实际面板渲染代码。可拖动时间查看进场、停留和退场。此页展示原生引擎，不包含本地 FFX
          效果，也不是 AE 渲染结果。
        </p>
      </header>
      <canvas id="stage" width="1280" height="720" aria-label="动态歌词排版演示"></canvas>
      <div class="player">
        <button id="play">暂停</button><button id="restart">重播</button
        ><button class="mode active" id="sequence">连续演示</button
        ><button class="mode" id="custom">当前组合</button
        ><input
          type="range"
          id="seek"
          min="0"
          max="32"
          step="0.001"
          value="0"
          aria-label="时间"
        /><output id="time">0.0 / 32.0s</output>
      </div>
      <div class="shots" id="shots"></div>
      <div class="controls">
        <label>排版预设<select id="layout"></select></label>
        <label
          >文字动作<select id="motion">
            <option value="auto">使用排版自带动作</option>
          </select></label
        >
        <label
          >字旁元素<select id="motif">
            <option value="none">不添加元素</option>
          </select></label
        >
        <label class="lyrics"
          >演示歌词<textarea id="lyrics">所有那些曾经复杂的旋律</textarea>
        </label>
        <label class="size"
          >文字大小 <span id="size-value">1.0</span
          ><input type="range" id="size" min="0.7" max="2" step="0.05" value="1.0"
        /></label>
      </div>
      <p class="intro">
        改变任一选项会进入“当前组合”，循环播放一段 4 秒的完整动作。连续演示包含 8
        种组合；所有排版与元素均来自新版面板。
      </p>
      <div class="notes">
        <span
          >演示标签、时间条与深色背景仅存在于本页，不会写入实际 PV。<br />歌词取自用户提供的《我只能离开》；此演示无音轨。</span
        ><span
          ><a href="../reference/1.4.2-preview/面板动效演示.mp4">打开 32 秒演示视频</a> ·
          <a href="../reference/1.4.2-preview/contact-sheet.png">查看进出场关键帧</a></span
        >
      </div>
    </main>
    <script src="../src/shared/motion.js"></script>
    <script src="../src/shared/motifs.js"></script>
    <script src="../src/shared/layout-fit.js"></script>
    <script src="../src/shared/choreography.js"></script>
    <script src="../src/shared/song-profiles.js"></script>
    <script src="../src/shared/presets.js"></script>
    <script src="../src/shared/annotations.js"></script>
    <script src="../src/shared/core.js"></script>
    <script src="../src/panel/render.js"></script>
    <script>
      (() => {
        const shots = [
          {
            label: '左岸落字',
            detail: '行楷主词 · 细宋短句 · 丝线与微光',
            style: 'poster-left',
            text: '我循着你的眼神痕迹',
            focus: '眼神',
            motifs: ['silk-orbit', 'twinkle-field'],
            accent: '#a9d2e7'
          },
          {
            label: '右岸错层',
            detail: '先小句后主词 · 错拍星光',
            style: 'poster-right',
            text: '忘不掉的是先离开的',
            focus: '忘不掉',
            motifs: ['corner-stars', 'pearl-drift'],
            accent: '#c1d5e9'
          },
          {
            label: '竖心横翼',
            detail: '竖向主词 · 旁句贴合 · 两岸月弧',
            style: 'axis-right',
            text: '揭开所有你留的难题',
            focus: '难题',
            motifs: ['crescent-frame', 'leaf-pair'],
            accent: '#c4d5d4'
          },
          {
            label: '斜邻小句',
            detail: '词组错层 · 光点沿弧游走',
            style: 'satellite-corner',
            text: '想念你的呼吸',
            focus: '呼吸',
            motifs: ['diamond-curve', 'twinkle-field'],
            accent: '#c2c9e4'
          },
          {
            label: '行间递进',
            detail: '留白中的阅读顺序 · 遮罩接句',
            style: 'stair-edge',
            text: '一瞬间掉落的泪只想牵着你不放',
            focus: '不放',
            motifs: ['stitch-curve', 'pearl-drift'],
            accent: '#d8cdbd'
          },
          {
            label: '错行释句',
            detail: '柔和字距 · 疏星明灭',
            style: 'broad-offset',
            text: '那些模糊破旧回忆',
            focus: '回忆',
            motifs: ['aurora-dots'],
            accent: '#a9cbd8'
          },
          {
            label: '主次揭幕',
            detail: '固定遮罩进退场 · 花瓣循线',
            style: 'reveal-word-3',
            text: '所有那些曾经复杂的旋律',
            focus: '旋律',
            motifs: ['petal-curve', 'leaf-pair'],
            accent: '#d8c6d0'
          },
          {
            label: '低位余音',
            detail: '主词与短句 · 双弧轻掠',
            style: 'banner-bottom',
            text: '我只能离开',
            focus: '离开',
            motifs: ['ribbon-swoosh', 'twinkle-field'],
            accent: '#bcd2df'
          }
        ];
        const $ = (id) => document.getElementById(id),
          canvas = $('stage'),
          ctx = canvas.getContext('2d'),
          lyricCanvas = document.createElement('canvas');
        lyricCanvas.width = 1280;
        lyricCanvas.height = 720;
        let mode = 'sequence',
          playing = true,
          time = 0,
          last = performance.now(),
          active = -1;
        for (const [id, name] of LMMotion.list) {
          const o = document.createElement('option');
          o.value = id;
          o.textContent = name;
          $('motion').append(o);
        }
        for (const [id, name] of LMMotifs.list) {
          const o = document.createElement('option');
          o.value = id;
          o.textContent = name;
          $('motif').append(o);
        }
        const groups = {};
        for (const style of LMCore.styles) {
          let g = groups[style.group];
          if (!g) {
            g = document.createElement('optgroup');
            g.label = style.group;
            groups[style.group] = g;
            $('layout').append(g);
          }
          const o = document.createElement('option');
          o.value = style.id;
          o.textContent = style.name;
          g.append(o);
        }
        shots.forEach((shot, i) => {
          const b = document.createElement('button');
          b.textContent = shot.label;
          b.onclick = () => {
            setMode('sequence');
            time = i * 4;
            draw(time);
          };
          $('shots').append(b);
        });
        function build(shot, custom = false) {
          const p = LMCore.defaults();
          Object.assign(p, {
            width: 1280,
            height: 720,
            fps: 30,
            scale: Number($('size').value),
            emphasisScale: 1.1,
            intensity: 0.62,
            opacity: 100,
            color: '#f3f1e9',
            font: 'SimSun',
            accent: shot.accent,
            highlightColor: shot.accent,
            highlightMode: 'color',
            ornamentDensity: 2,
            ornamentSize: 1.45,
            seed: 31,
            theme: 'user:demo',
            songProfile: 'user:demo',
            motionMode: custom ? $('motion').value : 'auto',
            recipe: { layouts: [shot.style], ornaments: shot.motifs, local: [] }
          });
          const anchor = LMCore.findStyle(shot.style).x;
          const cue = {
            text: shot.text,
            start: 0,
            end: 4,
            focus: shot.focus,
            highlight: shot.focus,
            style: shot.style,
            x: anchor < 0.5 ? 0.23 : 0.77
          };
          p.cues = [cue];
          return { p, cue };
        }
        function customShot() {
          const text = $('lyrics').value.trim() || '我只能离开',
            glyphs = LMCore.chars(text.replace(/\s/g, ''));
          return {
            label: LMCore.findStyle($('layout').value).name,
            detail: $('motion').selectedOptions[0].textContent,
            style: $('layout').value,
            text,
            focus: glyphs.slice(-2).join(''),
            motifs: $('motif').value === 'none' ? [] : [$('motif').value],
            accent: '#c5d7dc'
          };
        }
        function backdrop(shot) {
          const grad = ctx.createLinearGradient(0, 0, 1280, 720);
          grad.addColorStop(0, '#263744');
          grad.addColorStop(0.55, '#15232d');
          grad.addColorStop(1, '#111d28');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1280, 720);
          ctx.save();
          ctx.strokeStyle = 'rgba(182,201,207,.12)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(60, 75);
          ctx.lineTo(1220, 75);
          ctx.stroke();
          ctx.font = '12px "Microsoft YaHei"';
          ctx.fillStyle = '#8eaaaF';
          ctx.fillText('映词 1.4.2   /   面板动效演示', 60, 34);
          ctx.font = '15px "Microsoft YaHei"';
          ctx.fillStyle = '#e1e8e4';
          ctx.fillText(shot.label, 60, 60);
          ctx.font = '13px "Microsoft YaHei"';
          ctx.fillStyle = '#8da4b0';
          ctx.fillText(shot.detail, 248, 59);
          ctx.font = '11px "Microsoft YaHei"';
          ctx.fillStyle = '#6f8996';
          ctx.fillText('标签与背景仅用于演示 · 实际输出为透明歌词图层', 60, 681);
          ctx.textAlign = 'right';
          ctx.fillText('原生引擎预览 / 非 AE 渲染', 1220, 681);
          ctx.restore();
        }
        function draw(t, forcedIndex) {
          t = Math.max(0, t);
          const index = Math.max(
              0,
              Math.min(shots.length - 1, forcedIndex == null ? Math.floor(t / 4) : forcedIndex)
            ),
            local = forcedIndex == null ? t % 4 : t;
          const shot = mode === 'custom' ? customShot() : shots[index],
            data = build(shot, mode === 'custom');
          LMRender.render(lyricCanvas, data.p, local, { transparent: true, index });
          // Keep presentation labels and background separate from the actual transparent lyric renderer.
          backdrop(shot);
          ctx.drawImage(lyricCanvas, 0, 0);
          ctx.save();
          ctx.strokeStyle = shot.accent;
          ctx.globalAlpha = 0.45;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(60, 640);
          ctx.lineTo(60 + (1160 * local) / 4, 640);
          ctx.stroke();
          ctx.restore();
          if (forcedIndex == null) {
            $('seek').value = t;
            $('time').textContent =
              t.toFixed(1) + ' / ' + (mode === 'custom' ? '4.0' : '32.0') + 's';
            if (index !== active) {
              Array.from($('shots').children).forEach((el, i) =>
                el.classList.toggle('active', i === index && mode === 'sequence')
              );
              active = index;
            }
          }
        }
        function useShot(i) {
          const s = shots[i];
          $('layout').value = s.style;
          $('motif').value = s.motifs[0];
          $('lyrics').value = s.text;
        }
        function setMode(next) {
          mode = next;
          time = 0;
          active = -1;
          $('seek').max = mode === 'custom' ? 4 : 32;
          $('sequence').classList.toggle('active', mode === 'sequence');
          $('custom').classList.toggle('active', mode === 'custom');
        }
        $('play').onclick = () => {
          playing = !playing;
          $('play').textContent = playing ? '暂停' : '播放';
        };
        $('restart').onclick = () => {
          time = 0;
          draw(time);
        };
        $('sequence').onclick = () => {
          setMode('sequence');
          draw(time);
        };
        $('custom').onclick = () => {
          useShot(Math.min(7, Math.floor(time / 4)));
          setMode('custom');
          draw(time);
        };
        $('seek').oninput = () => {
          time = Number($('seek').value);
          draw(time);
        };
        for (const id of ['layout', 'motion', 'motif', 'lyrics', 'size'])
          $(id).addEventListener('input', () => {
            setMode('custom');
            $('size-value').textContent = Number($('size').value).toFixed(2);
            draw(time);
          });
        useShot(0);
        window.LMDemo = {
          shots,
          drawAt(t) {
            playing = false;
            mode = 'sequence';
            draw(Math.min(31.99999, Math.max(0, t)));
          },
          drawShot(i, t) {
            playing = false;
            mode = 'sequence';
            draw(t, i);
          },
          canvas
        };
        function tick(now) {
          const delta = Math.max(0, Math.min(0.1, (now - last) / 1000));
          last = now;
          if (playing) {
            time = (time + delta) % (mode === 'custom' ? 4 : 32);
            draw(time);
          }
          requestAnimationFrame(tick);
        }
        draw(0);
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
